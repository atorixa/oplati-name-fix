name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore.jks
            echo "Using repository keystore from secrets."
          else
            keytool -genkeypair -keystore keystore.jks -alias test \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=CI,O=OplatiNameFix,C=US"
            echo "::warning::KEYSTORE_B64 secret is not set - this build is signed with a throwaway key and cannot update an existing install."
          fi

      - name: Build APK
        shell: pwsh
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASS: android
          KEYSTORE_ALIAS: test
        run: ./build.ps1 -Sdk "$env:ANDROID_SDK_ROOT"

      - name: Show result
        run: |
          ls -l build/OplatiNameFix.apk
          sha256sum build/OplatiNameFix.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OplatiNameFix-apk
          path: build/OplatiNameFix.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/OplatiNameFix.apk
          generate_release_notes: true
